server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: bharat-pass
  threads:
    virtual:
      enabled: true

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bharatpass}
    username: ${DB_USERNAME:bharatpass}
    password: ${DB_PASSWORD:bharatpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  # File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Application-specific config
bharatpass:
  jwt:
    issuer: bharat-pass
    access-token-expiry: 900        # 15 minutes
    refresh-token-expiry: 604800    # 7 days
    rsa-key-path: ${JWT_RSA_KEY_PATH:classpath:keys/}

  vault:
    master-key: ${VAULT_MASTER_KEY:changeme-in-production-256bit-key!!}
    algorithm: AES/GCM/NoPadding
    key-length: 256

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:bharatpass-documents}

  booking:
    lock-wait-seconds: 3
    lock-lease-seconds: 300         # 5 minutes
    rate-limit-per-psk: 1000        # requests per second
    rate-limit-auth: 10             # per user per minute

  aadhaar:
    otp-expiry-minutes: 10
    max-otp-attempts-per-hour: 5

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.bharatpass: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
